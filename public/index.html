
<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>Lia — Assistant IA</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #11182b;
      --panel-light: #182239;
      --border: #29334b;
      --text: #eef2ff;
      --muted: #9da9c6;
      --accent: #7167f0;
      --accent-hover: #8178ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 16px 14px;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, #192548 0%, transparent 55%),
        var(--bg);
    }

    .app-header,
    .chat-container,
    footer {
      width: 100%;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 18px;
      padding: 4px 2px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #8178ff, #5145c8);
      box-shadow: 0 5px 24px #7167f033;
      color: white;
      font-size: 25px;
      font-weight: 800;
    }

    .brand-text {
      min-width: 0;
      flex: 1;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.3;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .assistant-label {
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: #c9c6ff;
      background: #151d32;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .chat-container {
      height: min(730px, calc(100vh - 165px));
      min-height: 390px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 24px 80px #00000030;
    }

    .chat-messages {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      padding: clamp(16px, 3vw, 28px);
      background:
        radial-gradient(ellipse at 10% 0%, #24274844, transparent 50%),
        var(--panel);
      overscroll-behavior: contain;
    }

    .message {
      width: fit-content;
      max-width: min(85%, 650px);
      margin: 0;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 17px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .message p {
      margin: 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .assistant-message {
      align-self: flex-start;
      border-top-left-radius: 6px;
      background: var(--panel-light);
      color: var(--text);
    }

    .user-message {
      align-self: flex-end;
      margin-left: auto;
      border-color: transparent;
      border-top-right-radius: 6px;
      background: #6258dc;
      color: white;
    }

    .typing-indicator {
      display: none;
      padding: 10px 20px;
      color: #b4b0ff;
      background: var(--panel);
      font-size: 0.9rem;
    }

    .typing-indicator.visible {
      display: block;
    }

    .composer {
      flex: 0 0 auto;
      padding: 13px;
      border-top: 1px solid var(--border);
      background: #0f1628;
    }

    .message-input {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    #user-input {
      display: block;
      flex: 1;
      width: 0;
      min-width: 0;
      height: 54px;
      min-height: 54px;
      max-height: 140px;
      padding: 15px 16px;
      border: 1px solid #35415e;
      border-radius: 15px;
      outline: none;
      background: #182239;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      resize: none;
      overflow-y: auto;
      -webkit-appearance: none;
    }

    #user-input::placeholder {
      color: #8895b3;
    }

    #user-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #7167f022;
    }

    #send-button {
      position: relative;
      z-index: 1;
      pointer-events: auto;
      flex: 0 0 auto;
      min-width: 54px;
      height: 54px;
      padding: 0 17px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 15px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    #send-button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    #send-button:active:not(:disabled) {
      transform: scale(0.97);
    }

    #send-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #send-button svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .composer-hint {
      margin: 9px 4px 0;
      color: #7f8ba7;
      font-size: 0.76rem;
    }

    footer {
      padding: 14px 4px 0;
      color: #7885a2;
      text-align: center;
      font-size: 0.78rem;
    }

    @media (max-width: 540px) {
      body {
        padding: 12px 10px;
      }

      .app-header {
        gap: 10px;
        margin-bottom: 12px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
        border-radius: 13px;
      }

      h1 {
        font-size: 1.25rem;
      }

      .subtitle {
        font-size: 0.8rem;
      }

      .assistant-label {
        padding: 6px 8px;
        font-size: 0.7rem;
      }

      .chat-container {
        height: calc(100vh - 145px);
        min-height: 350px;
        border-radius: 18px;
      }

      .chat-messages {
        padding: 14px 11px;
        gap: 11px;
      }

      .message {
        max-width: 91%;
        padding: 11px 13px;
      }

      .composer {
        padding: 10px;
      }

      .message-input {
        gap: 8px;
      }

      #user-input {
        padding: 14px 12px;
      }

      #send-button {
        min-width: 50px;
        width: 50px;
        padding: 0;
      }

      .send-label {
        display: none;
      }

      .composer-hint {
        font-size: 0.7rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #send-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="brand-mark" aria-hidden="true">L</div>
    <div class="brand-text">
      <h1>Lia</h1>
      <p class="subtitle">Ton assistant personnel</p>
    </div>
    <span class="assistant-label">Assistant IA</span>
  </header>

  <main class="chat-container">
    <div id="chat-messages" class="chat-messages" aria-live="polite">
      <div class="message assistant-message">
        <p>Salut ! Je suis Lia, ton assistant IA. Comment puis-je t’aider aujourd’hui ?</p>
      </div>
    </div>

    <div class="typing-indicator" id="typing-indicator">
      Lia réfléchit...
    </div>

    <div class="composer">
      <div class="message-input">
        <label for="user-input" hidden>Ton message</label>
        <textarea
          id="user-input"
          placeholder="Écris ton message à Lia..."
          rows="1"
          enterkeyhint="send"
          autocorrect="on"
          autocomplete="off"
          autocapitalize="sentences"
          spellcheck="true"
        ></textarea>

        <button id="send-button" type="button" aria-label="Envoyer le message" title="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 19V5M6 11l6-6 6 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          <span class="send-label">Envoyer</span>
        </button>
      </div>
      <p class="composer-hint">Entrée pour envoyer · Maj + Entrée pour une nouvelle ligne</p>
    </div>
  </main>

  <footer>
    Lia · Ton assistant IA personnel
  </footer>

  <script src="chat.js"></script>
</body>
</html>
